<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 KBM Bridge</title>
<style>
:root{
  --bg:#0d1016;--panel:#151a23;--panel2:#1b2230;--line:#263043;--text:#e8edf5;--dim:#8d99ad;
  --acc:#3d8bff;--acc2:#2a6fe0;--ok:#33c27f;--warn:#e8a33d;--bad:#ef5a5a;--chip:#222b3b;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(13,16,22,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header .ver{color:var(--dim);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.dot.active{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.native{background:var(--warn)}.dot.off{background:var(--bad)}
main{max-width:920px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
section{min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
section h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--dim)}.stat .v{font-size:17px;font-weight:600;margin-top:2px;overflow-wrap:break-word}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=number]{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:8px 12px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc2);border-color:var(--acc2)}
button.danger{border-color:#5a2a2a;color:#ffb3b3}
button.small{padding:5px 9px;font-size:13px}
textarea{width:100%;box-sizing:border-box;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg,#111);color:inherit;border:1px solid #555;border-radius:8px;padding:8px;margin:6px 0}
select.small{padding:5px 6px;font-size:13px;max-width:96px}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.targets button.on,#game .row button.on{background:var(--acc2);border-color:var(--acc2)}
.targets button.native.on{background:#8a5a12;border-color:#8a5a12}
.tabs-label{color:var(--dim);font-size:13px;margin:0 0 6px}
.gname{font-size:20px;font-weight:650;margin:0 0 6px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--dim);border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:#1f5a3f}.badge.warn{color:var(--warn);border-color:#6a4a1a}
.plist h3{font-size:12px;color:var(--dim);font-weight:600;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.plist .targets{margin-top:0}
details{margin-top:8px}summary{cursor:pointer;color:var(--dim);font-size:13px}
button:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button.on{background:var(--acc2);border-color:var(--acc2)}
.slider{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:8px 0}
.slider label{color:var(--dim);font-size:14px}
.slider output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
.check{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--text)}
.check input{width:18px;height:18px;accent-color:var(--acc)}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
th{font-size:12px;color:var(--dim);font-weight:600}
td.out{color:var(--dim);font-size:13px;white-space:nowrap}
.key{display:inline-flex;gap:4px;align-items:center}
.chip{display:inline-block;min-width:44px;text-align:center;background:var(--chip);border:1px solid var(--line);
  border-radius:7px;padding:4px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.empty{color:var(--dim);font-weight:400}
.chip.cap{border-color:var(--warn);color:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.muted{color:var(--dim);font-size:13px}
.note{background:var(--panel2);border-left:3px solid var(--acc);padding:10px 12px;border-radius:8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222c3d;border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.offline{display:none;background:#3a1f1f;border:1px solid #6a2c2c;color:#ffd0d0;padding:10px 14px;border-radius:10px}
/* TV (PS5 browser at 1080p+): everything bigger, readable from the couch */
@media (min-width:1500px){ body{zoom:1.4} }
.ps5hint{display:none;margin-left:auto;color:var(--dim);font-size:12px}
.isps5 .ps5hint{display:inline}
@media (max-width:640px){
  .slider{grid-template-columns:1fr 54px}.slider label{grid-column:1/3}
  #binds,#binds tr,#binds td{display:block}
  table thead{display:none}
  #binds tr{padding:10px 0;border-bottom:1px solid var(--line)}
  #binds td{border:0;padding:3px 0}
  #binds td:first-child{font-weight:600}
  #binds td.out{display:block;padding-top:0}
  .key{flex-wrap:wrap}
  main{padding:12px}section{padding:14px}
}
.langsel button.on{background:var(--acc2);border-color:var(--acc2)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>PS5 KBM Bridge</h1>
  <span class="ver" id="ver"></span>
  <span class="ps5hint" data-i18n="ps5hint"></span>
</header>
<main>
  <div class="offline" id="offline" data-i18n="offline"></div>

  <section>
    <h2 data-i18n="h_status"></h2>
    <div class="stats" id="stats"></div>
    <div class="row" id="ptrRow" style="margin-top:10px"></div>
  </section>

  <section id="gameSec">
    <h2 data-i18n="h_game"></h2>
    <div id="game"></div>
  </section>

  <section>
    <h2 data-i18n="h_profile"></h2>
    <p class="tabs-label" data-i18n="editing"></p>
    <div id="pcur"></div>
    <div class="plist" id="plist"></div>
    <div id="pnotes"></div>
    <div id="params"></div>
    <div class="row" style="margin-top:10px">
      <button class="small" id="btnUseGame" style="display:none"></button>
      <button class="small" id="btnDefault" data-i18n="btn_default"></button>
      <button class="small danger" id="btnReset" data-i18n="btn_reset"></button>
    </div>
  </section>

  <section>
    <h2 data-i18n="h_share"></h2>
    <p class="muted" style="margin-top:-4px" data-i18n="share_help"></p>
    <div class="row">
      <button class="small" id="btnExport"></button>
      <button class="small danger" id="btnDelCustom" style="display:none"></button>
    </div>
    <div id="exportBox" style="display:none">
      <textarea id="exportText" rows="8" readonly></textarea>
      <div class="row"><button class="small" id="btnDl" data-i18n="btn_dl"></button><button class="small" id="btnCopy" data-i18n="btn_copy"></button></div>
    </div>
    <h3 data-i18n="import_h"></h3>
    <textarea id="importText" rows="5"></textarea>
    <div class="row"><input type="file" id="importFile" accept=".json,application/json"><button class="small" id="btnImport" data-i18n="btn_import"></button></div>
  </section>

  <section>
    <h2 data-i18n="h_binds"></h2>
    <p class="muted" style="margin-top:-4px" data-i18n-html="binds_help"></p>
    <table><thead><tr><th data-i18n="th_action"></th><th class="out" data-i18n="th_pad"></th><th data-i18n="th_key1"></th><th data-i18n="th_key2"></th></tr></thead>
    <tbody id="binds"></tbody></table>
  </section>

  <section>
    <h2 data-i18n="h_general"></h2>
    <div class="row langsel" id="langRow" style="margin-bottom:10px"></div>
    <div class="row" style="margin-bottom:8px">
      <label class="muted" for="hz" data-i18n="hz_label"></label>
      <select id="hz">
        <option value="0" data-i18n="hz_auto"></option>
        <option value="60">60 Hz</option><option value="120">120 Hz</option><option value="250">250 Hz</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="auto"> <span data-i18n="opt_auto"></span></label>
    <label class="check"><input type="checkbox" id="nat"> <span data-i18n="opt_nat"></span></label>
    <label class="check"><input type="checkbox" id="autonat"> <span data-i18n="opt_autonat"></span></label>
    <label class="check"><input type="checkbox" id="rel"> <span data-i18n="opt_rel"></span></label>
    <label class="check"><input type="checkbox" id="notmode"> <span data-i18n="opt_notmode"></span></label>
    <div id="autostartRow">
    <label class="check"><input type="checkbox" id="autostart"> <span data-i18n="opt_autostart"></span></label>
    <p class="muted" id="autostartNote" style="margin:0 0 8px 26px"></p>
    </div>
    <div class="slider"><label for="psens" data-i18n="psens"></label>
      <input type="range" id="psens" min="1" max="50" step="1"><output id="psens_o"></output></div>
    <p class="muted" style="margin-top:0" data-i18n-html="ptr_help"></p>
    <label class="check"><input type="checkbox" id="openpage"> <span data-i18n="opt_openpage"></span></label>
    <div class="row" style="margin:6px 0">
      <label class="muted" for="idle" data-i18n="idle_label"></label>
      <select id="idle">
        <option value="0" data-i18n="idle_0"></option>
        <option value="15" data-i18n="idle_15"></option><option value="30" data-i18n="idle_30"></option><option value="60" data-i18n="idle_60"></option>
      </select>
    </div>
    <p class="muted" id="hzNote"></p>
  </section>

  <section>
    <h2 data-i18n="h_titles"></h2>
    <div id="titles"></div>
  </section>

  <section>
    <h2 data-i18n="h_help"></h2>
    <p class="muted" style="margin-top:-4px" data-i18n-html="help_text"></p>
    <div class="row"><button class="small" id="btnDiag" data-i18n="btn_diag"></button></div>
    <div id="diagBox" style="display:none">
      <textarea id="diagText" rows="8" readonly></textarea>
      <div class="row"><button class="small" id="btnDiagDl" data-i18n="btn_dl_txt"></button><button class="small" id="btnDiagCopy" data-i18n="btn_copy"></button></div>
    </div>
  </section>

  <section>
    <div class="row" style="justify-content:space-between">
      <span class="muted" data-i18n="saved_at"></span>
      <button class="danger" id="btnStop" data-i18n="btn_stop"></button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

const t = (k, vars) => { let s = (STR[L] && STR[L][k]) || STR.es[k] || k; if (vars) for (const v in vars) s = s.replace("{" + v + "}", vars[v]); return s; };
const kn = k => k ? (KEYNAMES[L][k] || k) : "—";
const on = o => o.split("+").map(x => OUTNAMES[L][x] || x).join(" + ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pnameOf = p => (L === "en" && p.name_en ? p.name_en : p.name).replace(/^(Plantilla|Template): /, "");
const alabel = a => (L === "en" && a.label_en) ? a.label_en : a.label;

/* Language: the setting, else the PS5 system language, else the browser's. */
function pickLang(){
  const c = S.config.lang, sys = S.runtime.sys_lang;
  if (c === "es" || c === "en") return c;
  if (sys === "es" || sys === "en") return sys;
  return /^es\b/i.test(navigator.language || "") ? "es" : "en";
}
function applyStatic(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
}

function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove("show"),2600);}
async function call(path, params){
  const qs = new URLSearchParams(params||{}).toString();
  try{
    const r = await fetch(API + path + (qs?"?"+qs:""));
    const j = await r.json();
    if(!j.ok) toast(t("err") + (j.error||r.status));
    else if(j.moved_from){
      const a = (profile().actions || []).find(x => x.id === j.moved_from);
      toast(t("moved", {a: a ? alabel(a) : j.moved_from}));
    }
    await refresh(true);
    return j;
  }catch(e){toast(t("noconn"));return null;}
}
function profile(){ return S.config.edit || {id:"", name:"", actions:[], notes:""}; }
const pinfo = id => S.config.profiles.find(p => p.id === id);
const pname = id => { const p = pinfo(id); return p ? pnameOf(p) : id; };
const byName = (a, b) => pnameOf(a).localeCompare(pnameOf(b), L, {sensitivity: "base"});
const CONF = {3:"ok", 2:"warn", 1:"warn", 0:""};
function setHTML(el, html){ if (el._h === html) return false; el.innerHTML = html; el._h = html; return true; }
/* While a <select> picker is open (PS5 shows its own overlay) do not touch the page. */
let freezeUntil = 0;
document.addEventListener("focusin", e => { if (e.target.tagName === "SELECT") freezeUntil = Date.now() + 15000; });
document.addEventListener("pointerdown", e => { if (e.target.tagName === "SELECT") freezeUntil = Date.now() + 15000; });
document.addEventListener("change", () => { freezeUntil = 0; });

function renderRuntime(){
  const r = S.runtime;
  $("ver").textContent = "v" + r.version + (r.diag ? " · diag" : "");
  const d = $("dot"); d.className = "dot " + (r.status==="active"?"active":r.status==="native"||r.status==="released"?"native":r.status==="stopped"?"off":"");
  const lat = r.e2i_p95_us ? (r.e2i_p50_us/1000).toFixed(1) + " / " + (r.e2i_p95_us/1000).toFixed(1) + " ms" : "—";
  const isNative = r.title_source === "native" || r.title_source === "auto_native";
  const items = [
    [t("k_status"), t("st_" + r.status) === "st_" + r.status ? r.status : t("st_" + r.status)],
    [t("k_game"), r.title ? (r.title_name || r.title) : t("v_menu")],
    [t("k_profile"), isNative ? t("v_native") : pname(r.profile)],
    [t("k_receiver"), r.receiver ? t("v_rx_bridge") : t("v_rx_ps5")],
    [t("k_vda"), r.vda ? t("v_connected") : t("v_no")],
    [t("k_pad"), r.pad || "—"],
    [t("k_inject"), r.hz + " Hz"],
    [t("k_lat"), lat],
    [t("k_reports"), r.kb_reports_5s + " / " + r.mouse_reports_5s],
    [t("k_mouse"), r.pointer_mode ? t("v_cursor") : r.mouse_dpad ? t("v_dpad") : t("v_camera")],
  ];
  const MODES = {0: "v_foot", 1: "v_vehicle", 3: "v_bike", 4: "v_air"};
  if (r.has_layers) items.splice(3, 0, [t("k_mode"), t(MODES[r.layer] || "v_foot")]);
  setHTML($("stats"), items.map(([k,v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join(""));
  /* Only rebuild interactive parts when they change: on the PS5 browser a node
   * replaced between press and release (or while a picker is open) loses the click. */
  if (setHTML($("ptrRow"), `<button class="small" id="ptrBtn">${esc(r.pointer_mode ? t("ptr_to_cam") : t("ptr_to_cur"))} (F9)</button>
      <button class="small" id="retakeBtn" title="${esc(t("retake_help"))}">${esc(t("retake"))} (F8)</button>`)) {
    $("ptrBtn").onclick = () => call("/api/pointer", {on: S.runtime.pointer_mode ? 0 : 1});
    $("retakeBtn").onclick = () => call("/api/retake").then(j => { if (j && j.ok) toast(t("retake_ok")); });
  }

  const g = $("game");
  if(!r.title){
    if (setHTML(g, `<p class="muted">${esc(t("no_game"))}</p><div class="targets"><button class="small" id="editMenu">${esc(t("edit_menu"))}</button></div>`))
      $("editMenu").onclick = () => { sel = "ps_menu"; showList = false; refresh(true); };
  }
  else {
    const rule = S.config.titles.find(x => x.tid === r.title);
    const cur = rule ? rule.target : "auto";
    const P = S.config.profiles;
    const tpl = P.filter(p => p.kind === "template");
    const games = P.filter(p => p.kind === "game").sort(byName);
    const btn = (v, txt, extra) => `<button class="${v===cur?"on":""} ${extra||""}" data-target="${v}">${v===cur?"✓ ":""}${esc(txt)}</button>`;
    let row = btn("auto", t("t_auto") + pname(r.auto_profile)) + btn("native", t("t_native"), "native")
      + tpl.map(p => btn(p.id, pnameOf(p))).join("");
    if (cur !== "auto" && cur !== "native" && !tpl.some(p => p.id === cur)) row += btn(cur, pname(cur));
    row += `<button data-other="1">${esc(showOther ? t("t_hide") : t("t_other"))}</button>`;
    const other = showOther ? `<div class="plist"><h3>${esc(t("t_games_az"))}</h3><div class="targets">${games.map(p => btn(p.id, pnameOf(p))).join("")}</div></div>` : "";
    const sug = r.native_suggested ? `<p class="note">${t("sug_native")}</p>` : "";
    const modeRow = r.has_layers && !r.overlay ? `<div class="row" style="margin-top:8px"><span class="muted">${esc(t("k_mode"))}:</span>
        ${[0, 1, 3, 4].filter(v => v === 0 || (r.has_layers & (1 << v))).map(v => [v, t(MODES[v])]).map(([v, txt]) => `<button class="small ${r.layer === v ? "on" : ""}" data-layer="${v}">${r.layer === v ? "✓ " : ""}${esc(txt)}</button>`).join("")}
        <span class="muted">${esc(t("mode_help"))}</span></div>` : "";
    const html = `<div class="gname">${esc(r.title_name || t("unknown_game"))}</div>
      <div class="row"><span class="chip">${esc(r.title)}</span><span class="muted">${esc(r.title_source ? t("src_" + r.title_source + (r.title_source === "overlay" && r.focus_auto ? "_auto" : "")) : "")}</span></div>
      ${sug}${modeRow}
      <div class="targets">${row}</div>${other}
      <p class="muted">${esc(t("game_help"))}</p>`;
    if (setHTML(g, html)) {
      g.querySelectorAll("[data-target]").forEach(b => b.onclick = () => call("/api/title", {tid: S.runtime.title, target: b.dataset.target}));
      g.querySelector("[data-other]").onclick = () => { showOther = !showOther; renderRuntime(); };
      g.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => call("/api/layer", {l: b.dataset.layer}));
    }
  }
  const ug = $("btnUseGame");
  if (r.title) { ug.style.display = ""; ug.textContent = t("use_in") + (r.title_name || r.title); } else ug.style.display = "none";
}

function slider(id, label, min, max, step, val, unit){
  return `<div class="slider"><label for="${id}">${esc(label)}</label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">
    <output id="${id}_o">${val}${unit||""}</output></div>`;
}

          <option value="">…</option><option value="NONE">${esc(t("none"))}</option>
          ${S.keys.map(k=>`<option value="${k}">${esc(kn(k))}</option>`).join("")}</select></span></td>`;}).join("")}</tr>`).join("");
  $("binds").querySelectorAll("[data-act=cap]").forEach(b => b.onclick = () => {
    call("/api/capture", {profile:p.id, action:b.dataset.a, slot:b.dataset.s}).then(j => j && j.ok && toast(t("press_now")));
  });
  $("binds").querySelectorAll("[data-act=pick]").forEach(s => s.onchange = () => {
    if(s.value) call("/api/bind", {profile:p.id, action:s.dataset.a, slot:s.dataset.s, key:s.value});
  });

  /* language buttons (no <select>: the PS5 browser handles buttons better) */
  const lg = c.lang || "auto";
  $("langRow").innerHTML = `<span class="muted">${esc(t("lang_label"))}</span>` +
    [["auto", t("lang_auto")], ["es", "Español"], ["en", "English"]].map(([v, txt]) =>
      `<button class="small ${v===lg?"on":""}" data-lang="${v}">${v===lg?"✓ ":""}${esc(txt)}</button>`).join("");
  $("langRow").querySelectorAll("[data-lang]").forEach(b => b.onclick = () => call("/api/global", {lang: b.dataset.lang}));

  $("hz").value = String(c.inject_hz);
  const r = S.runtime;
  $("autostartRow").style.display = r.etahen ? "" : "none";
  $("autostart").checked = !!r.autostart_on;
  $("autostart").disabled = !r.autostart_avail;
  $("autostartNote").textContent = r.autostart_avail ? (r.autostart_on ? t("as_on") : t("as_avail")) : t("as_missing");
  $("idle").value = String([0,15,30,60].includes(c.idle_exit_min) ? c.idle_exit_min : 0);
  $("openpage").checked = !!c.open_settings_on_launch;
  $("psens").value = c.pointer_sens; $("psens_o").textContent = c.pointer_sens;
  $("auto").checked = !!c.auto_activate; $("nat").checked = !!c.native_switch; $("autonat").checked = !!c.auto_native; $("notmode").checked = !!c.notify_mode; $("rel").checked = !!c.release_on_exit;
  $("hzNote").textContent = t("hz_note", {hz: c.effective_hz});

  const T = c.titles;
  $("titles").innerHTML = T.length ? `<table>${T.map(x => {
      return `<tr><td>${esc(x.name || "?")} <span class="chip">${esc(x.tid)}</span></td><td>${esc(x.target==="native"?t("v_native"):pname(x.target))}</td>
      <td style="text-align:right"><button class="small danger" data-t="${x.tid}">${esc(t("forget"))}</button></td></tr>`;}).join("")}</table>`
    : `<p class="muted">${esc(t("no_titles"))}</p>`;
  $("titles").querySelectorAll("[data-t]").forEach(b => b.onclick = () => call("/api/title", {tid:b.dataset.t, target:""}));
}

async function refresh(force){
  try{
    const r = await fetch(API + "/api/state" + (sel ? "?edit=" + encodeURIComponent(sel) : ""), {cache:"no-store"});
    S = await r.json();
    $("offline").style.display = "none";
  }catch(e){ $("offline").style.display = "block"; return; }
  if (!force && Date.now() < freezeUntil) return;
  L = pickLang();
  const langChanged = L !== lastLang;
  if (langChanged) { lastLang = L; applyStatic(); }
  renderRuntime();
  const cfg = L + JSON.stringify(S.config) + JSON.stringify(S.runtime.capture) + S.runtime.receiver + S.runtime.autostart_avail + S.runtime.autostart_on + S.runtime.pointer_mode;
  const editing = busy || (document.activeElement && document.activeElement.tagName === "SELECT");
  if(force || langChanged || (cfg !== lastCfg && !editing)){ lastCfg = cfg; renderConfig(); }
  if(S.runtime.capture.result && S.runtime.capture.result !== window._lastCap){
    window._lastCap = S.runtime.capture.result;
    if(!S.runtime.capture.active) toast(S.runtime.capture.result === "timeout" ? t("cap_timeout") :
       S.runtime.capture.result === "cancelled" ? t("cap_cancel") : t("cap_ok") + kn(S.runtime.capture.result));
  }
}

$("btnDefault").onclick = () => call("/api/global", {default_profile: profile().id});
$("btnUseGame").onclick = () => { if (S.runtime.title) call("/api/title", {tid: S.runtime.title, target: profile().id}); };
$("btnReset").onclick = () => { if(confirm(t("confirm_reset"))) call("/api/reset", {profile: profile().id}); };
let exportName = "profile.json";
$("btnExport").onclick = async () => {
  try {
    const r = await fetch(API + "/api/export?id=" + encodeURIComponent(profile().id), {cache: "no-store"});
    const txt = await r.text();
    if (!r.ok) { toast(t("err") + r.status); return; }
    exportName = profile().id + ".json";
    $("exportText").value = txt; $("exportBox").style.display = "";
  } catch (e) { toast(t("noconn")); }
};
$("btnDl").onclick = () => download(exportName, $("exportText").value, "application/json");
$("btnCopy").onclick = () => copyText($("exportText"));
$("importFile").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { $("importText").value = String(rd.result || ""); };
  rd.readAsText(f);
};
$("btnImport").onclick = async () => {
  const body = $("importText").value.trim();
  if (!body) { toast(t("import_empty")); return; }
  try {
    const r = await fetch(API + "/api/import", {method: "POST", headers: {"Content-Type": "text/plain"}, body});
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!j || !j.ok) { toast(t("err") + ((j && j.error) || r.status)); return; }
    sel = j.id; $("importText").value = ""; $("importFile").value = "";
    await refresh(true);
    toast(t("imported", {n: pname(j.id)}) + (j.message ? " — " + j.message : ""));
  } catch (e) { toast(t("noconn")); }
};
function download(name, text, type) {
  const u = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1000);
}
async function copyText(ta) {
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand("copy"); } catch (e2) {} }
  toast(t("copied"));
}
$("btnDiag").onclick = async () => {
  try {
    const r = await fetch(API + "/api/diag", {cache: "no-store"});
    if (!r.ok) { toast(t("err") + r.status); return; }
    $("diagText").value = await r.text(); $("diagBox").style.display = "";
  } catch (e) { toast(t("noconn")); }
};
$("btnDiagDl").onclick = () => download("ps5-kbm-diagnostics-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".txt", $("diagText").value, "text/plain");
$("btnDiagCopy").onclick = () => copyText($("diagText"));
$("btnDelCustom").onclick = () => {
  const p = profile();
  if (!confirm(t("confirm_del", {n: pnameOf(p)}))) return;
  if (!p.overrides) sel = "";            /* it disappears: go back to the profile in use */
  $("exportBox").style.display = "none";
  call("/api/delete_profile", {id: p.id});
};
$("hz").onchange = e => call("/api/global", {inject_hz: e.target.value});
$("auto").onchange = e => call("/api/global", {auto_activate: e.target.checked?1:0});
$("nat").onchange = e => call("/api/global", {native_switch: e.target.checked?1:0});
$("autonat").onchange = e => call("/api/global", {auto_native: e.target.checked?1:0});
$("notmode").onchange = e => call("/api/global", {notify_mode: e.target.checked?1:0});
$("rel").onchange = e => call("/api/global", {release_on_exit: e.target.checked?1:0});
$("autostart").onchange = e => call("/api/autostart", {on: e.target.checked?1:0});
$("idle").onchange = e => call("/api/global", {idle_exit_min: e.target.value});
$("openpage").onchange = e => call("/api/global", {open_settings_on_launch: e.target.checked?1:0});
$("psens").oninput = e => { $("psens_o").textContent = e.target.value; busy = true; };
$("psens").onchange = e => { busy = false; call("/api/global", {pointer_sens: e.target.value}); };
$("btnStop").onclick = () => { if(confirm(t("confirm_stop"))) call("/api/stop"); };

if (/PlayStation/i.test(navigator.userAgent)) document.documentElement.classList.add("isps5");
refresh(true);
setInterval(refresh, 1000);
</script>
</body>
</html>
